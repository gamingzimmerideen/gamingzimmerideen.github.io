name: Pins für nächste Woche

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Erster Tag (JJJJ-MM-TT), leer = nächster Montag"
        required: false
  schedule:
    # donnerstags 08:23 UTC (09:23 Uhr in Deutschland)
    - cron: "23 8 * * 4"

permissions:
  contents: write
  pages: write

concurrency:
  group: pin-bot
  cancel-in-progress: false

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schrift installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-inter

      - name: Pakete installieren
        run: pip install -r bot/requirements.txt

      - name: Pins erstellen
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          if [ -n "$START" ]; then
            python bot/bot.py --ausgabe wochen --start "$START"
          else
            python bot/bot.py --ausgabe wochen
          fi

      - name: Speichern
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add wochen bot/verlauf.json
          if git diff --cached --quiet; then
            echo "Nichts Neues."
          else
            git commit -m "Pins für neue Woche"
            git push
          fi

      - name: Webseite neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
